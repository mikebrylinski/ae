<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Andy Ebert — worldwide touring monitor engineer since 1997. Credits include Alanis Morissette, The Weeknd, Maroon 5, Guns N’ Roses, Mariah Carey, and more."
    />
    <meta property="og:title" content="Andy Ebert | Monitor Engineer" />
    <meta
      property="og:description"
      content="When artists need to hear perfection. Monitor and FOH engineering on the world’s biggest stages."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Andy Ebert | Live Production</title>
    <script>
      (function () {
        var ua = navigator.userAgent
        if (/CriOS|FxiOS|EdgiOS|Chrome|Chromium|Android/i.test(ua)) return
        if (/Safari/i.test(ua) || navigator.vendor === 'Apple Computer, Inc.') {
          document.documentElement.classList.add('is-safari')
        }
      })()
    </script>
    <style>
      #boot-line {
        position: fixed;
        top: 0;
        right: 0;
        left: 0;
        z-index: 100;
        height: 3px;
        overflow: hidden;
        background: #0a0a0a;
      }
      #boot-line > span {
        display: block;
        height: 100%;
        width: 38%;
        background: #b8ff00;
        transform: translate3d(-120%, 0, 0);
        animation: boot-line-sweep 1.15s ease-in-out infinite;
      }
      @keyframes boot-line-sweep {
        0% { transform: translate3d(-120%, 0, 0); }
        100% { transform: translate3d(360%, 0, 0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-line > span {
          animation: none;
          width: 42%;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-line" aria-hidden="true"><span></span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
